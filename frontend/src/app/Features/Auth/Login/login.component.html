<div class="login-page">
  <section class="login-shell">
    <!-- ══════════════════════════════════════════
         PANEL IZQUIERDO — imagen de elevador + logo
         ══════════════════════════════════════════ -->
    <div class="brand-panel">
      <div class="elevator-photo"></div>
      <div class="brand-overlay"></div>

      <div class="brand-content">
        <!-- Logo completo (imagen real):
             src="Assets/Img/LogoRAMACorrecto.png" -->
        <img
          src="Assets/Img/LogoRAMACorrecto.png"
          alt="RAMA Elevadores"
          class="logo-image"
        />

        <div class="separator"></div>

        <p>SISTEMA DE COTIZACIONES<br />Y SERVICIOS</p>
      </div>
    </div>

    <!-- ══════════════════════════════════════════
         PANEL DERECHO — formulario
         ══════════════════════════════════════════ -->
    <div class="form-panel">
      <div class="login-card">
        <h1>Bienvenido de nuevo</h1>
        <p class="subtitle">Por favor inicia sesión para continuar</p>

        <!-- Email -->
        <div class="input-group" [class.has-error]="error">
          <span class="input-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="M2 7l10 7 10-7" />
            </svg>
          </span>
          <input
          autofocus
            type="email"
            placeholder="Correo electrónico"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
          />
        </div>

        <!-- Contraseña -->
        <div class="input-group" [class.has-error]="error">
          <span class="input-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Contraseña"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
          />
          <button
            class="eye-btn"
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="
              showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'
            "
          >
            <!-- Ojo abierto -->
            <svg
              *ngIf="!showPassword"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- Ojo cerrado -->
            <svg
              *ngIf="showPassword"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
              />
              <path
                d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>

        <!-- Opciones -->
        <div class="options">
          <label class="remember">
            <span
              class="custom-check"
              [class.checked]="rememberMe"
              (click)="rememberMe = !rememberMe"
            ></span>
            Recordarme
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón principal -->
        <button class="btn-login" type="button" (click)="ingresar()">
          Iniciar Sesión
        </button>

        <!-- Error -->
        <div class="error-msg" *ngIf="error">{{ error }}</div>

        <!-- Divisor social -->
        <div class="divider"><span>O CONTINÚA CON</span></div>

        <!-- Botones sociales -->
        <div class="social-row">
          <button class="btn-social" type="button" aria-label="Google">
            <svg width="22" height="22" viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#fff"
              />
              <path
                d="M12 23c2.97 0 5.46-1 7.28-2.69l-3.57-2.77c-.99.67-2.26 1.07-3.71 1.07-2.87 0-5.3-1.94-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#fff"
              />
              <path
                d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                fill="#fff"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.46 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.86-2.59 3.29-4.53 6.16-4.53z"
                fill="#fff"
              />
            </svg>
          </button>
          <button class="btn-social" type="button" aria-label="GitHub">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"
              />
            </svg>
          </button>
          <button class="btn-social" type="button" aria-label="Twitter / X">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
              />
            </svg>
          </button>
        </div>

        <!-- Registro -->
        <p class="register-line">
          ¿No tienes una cuenta? <a href="#">Regístrate</a>
        </p>
      </div>
    </div>
  </section>

  <footer>© 2024 Rama Elevadores. Todos los derechos reservados.</footer>
</div>
